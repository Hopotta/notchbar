name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\NotchBar.sln

      - name: Build
        run: dotnet build .\NotchBar.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\NotchBar.Tests\NotchBar.Tests.csproj -c Release --no-build --no-restore
